name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to a commit SHA (the tag is in the comment).
# Bump them deliberately; the release workflow (phase 14) must keep this rule.
# The setup steps both jobs share (and their pins) live in
# .github/actions/setup/action.yml.

jobs:
  # Wails needs CGO and a native webview per OS and cannot be cross-compiled
  # (UI-0001), so every OS builds natively. Linux builds against GTK 4 and
  # WebKitGTK 6.0, the default of Wails v3.1. Both jobs run on all three OSes
  # because the build-tagged platform code only compiles (and lints) on its own
  # OS. The job names carry the OS so each matrix leg is its own, stable check.
  lint:
    name: lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          golangci-lint: 'true'
          tools-target: tools

      - name: Lint
        run: make check-lint

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          tools-target: tools-wails3

      - name: Test
        run: make check-test

      - name: Build
        run: make build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: commitbrief-ui-${{ runner.os }}
          path: |
            bin/
            !bin/.wails-provider-checked
          if-no-files-found: error
          retention-days: 7
